spring:
    application:
        name: config-server
        profiles:
            active:
                - native, git
    cloud:
        config:
            server:
                native:
                    search-locations: classpath:/config
                git:
                    uri: https://github.com/ihuaylupo/config.git
                    searchPaths: licensing_service

server:
    port: 8071
